<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country and Code Select</title>
</head>
<body>

  <label for="country">Select Country:</label>
  <select id="country">
    <option value="India">India</option>
    <option value="Pakistan">Pakistan</option>
    <option value="New Zealand">New Zealand</option>
  </select>

  <br>

  <label for="country-code">Select Country Code:</label>
  <select id="country-code">
    <option value="+91">+91</option>
    <option value="+92">+92</option>
    <option value="+123">+123</option>
  </select>

  <script>
    // Get the two select elements
    const countrySelect = document.getElementById('country');
    const codeSelect = document.getElementById('country-code');

    // Function to update the country code based on the country selected
    function updateCountryCode() {
      const country = countrySelect.value;
      
      // Map countries to their respective country codes
      const countryCodeMap = {
        'India': '+91',
        'Pakistan': '+92',
        'New Zealand': '+123'
      };

      // Update the second select element to match the country code
      codeSelect.value = countryCodeMap[country] || ''; // Default to empty if no match
    }

    // Listen for changes on the country select element
    countrySelect.addEventListener('change', updateCountryCode);

    // Set the initial country code based on the default selected country
    updateCountryCode();
  </script>

</body>
</html>
